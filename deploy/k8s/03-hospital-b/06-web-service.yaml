
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: hospital-b
  labels:
    app.kubernetes.io/name: hospital-web
    app.kubernetes.io/instance: hospital-b
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: hospital-management
  annotations:
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hospital-web
    app.kubernetes.io/instance: hospital-b
  ports:
    - name: http
      port: 80
      targetPort: http

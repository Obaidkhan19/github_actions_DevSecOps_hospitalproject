
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: hospital-b
  labels:
    app.kubernetes.io/instance: hospital-b
    app.kubernetes.io/part-of: hospital-management
spec:
  ingressClassName: traefik
  rules:
    - host: hospital-b.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80

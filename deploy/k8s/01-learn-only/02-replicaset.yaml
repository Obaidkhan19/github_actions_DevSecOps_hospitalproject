
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: demo-rs
  namespace: learn
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-rs
  template:
    metadata:
      labels:
        app: demo-rs
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80

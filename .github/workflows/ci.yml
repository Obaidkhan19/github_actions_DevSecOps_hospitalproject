name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/HospitalManagement.Web --configuration Release
      - run: dotnet test tests/HospitalManagement.Tests --configuration Release
# =====================================================================
# FILE: secrets_devsecops.yml        (SECRET SCANNING with Gitleaks)
# =====================================================================
# 1. WHAT IT IS
#    Secret scanning looks for passwords, tokens and keys that someone
#    committed to Git by mistake. A leaked key in a public repository can
#    be abused within minutes. Gitleaks is a free open-source scanner.
#
# 2. HOW IT WORKS
#    Gitleaks reads the files AND the whole Git history (every old commit)
#    and matches them against hundreds of patterns, for example the
#    typical shape of a GitHub token or a cloud access key.
#    That is why the checkout step below loads the full history.
#
# 3. WHEN IT RUNS
#    On every push, and on "Run workflow".
#
# 4. ONE-TIME SETUP
#    None for a repository in a PERSONAL account (like yours).
#    A repository owned by a GitHub ORGANIZATION needs a free license key
#    stored as the secret GITLEAKS_LICENSE (see gitleaks.com).
#
# 5. HOW TO USE / READ THE RESULT
#    If a secret is found the run turns red. Open the failed step: it
#    shows the file, the line and the rule that matched.
#    IMPORTANT: if a real secret leaks, deleting it from the code is not
#    enough, because it stays in the Git history. Change (rotate) the
#    secret at the service that issued it. That is the real fix.
#    False alarm? Add the fingerprint to a file called .gitleaksignore.
#
# 6. HOW TO MAKE IT STRICT
#    It is already strict: a finding fails the run.
#
# 7. THIS FILE IS INDEPENDENT
#    It does not need any other workflow file.
# =====================================================================

name: secrets_devsecops

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write        # lets the scanner comment on pull requests

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # fetch-depth 0 = download the whole history, not only the last commit.
      - name: Get the code with its full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Run Gitleaks. GITHUB_TOKEN is created by GitHub for every run.
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
